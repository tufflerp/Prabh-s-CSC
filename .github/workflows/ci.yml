name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Data is up to date with skills/
        run: |
          npm run build
          git diff --exit-code -- apps/skill-connector/data
      - run: npm test
      - run: npm run check
      - name: Desktop app smoke test
        run: xvfb-run -a npm run check:desktop
